<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ego</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0;
    min-height: 100vh;
    cursor: none;
    background: #000;
    overflow-x: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 15px;
  }
  @media (hover: hover) and (pointer: fine) {
    body { cursor: none; }
    .cursor, .cursor-dot { display: block; }
  }
  @media (hover: none) and (pointer: coarse) {
    .cursor, .cursor-dot { display: none !important; }
  }
  .bg-image {
    position: fixed;
    top: -5%;
    left: -5%;
    width: 110%;
    height: 110%;
    background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjxr2Db25gTrgmcP2VkeZzhdiwSKxGZjD1K0u6PtZvCA&s=10');
    background-size: cover;
    background-position: center;
    filter: brightness(0.6) contrast(1.2) saturate(1.3);
    animation: bgFloat 20s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes bgFloat {
    0% { transform: scale(1.05); }
    100% { transform: scale(1.15); }
  }
  .scanlines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      transparent, transparent 2px, rgba(0,255,255,0.03) 3px
    );
    z-index: 2;
    pointer-events: none;
  }
  .cursor {
    position: fixed;
    width: 30px;
    height: 30px;
    border: 2px solid #0ff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transition: transform 0.2s ease;
    box-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
  }
  .cursor-dot {
    position: fixed;
    width: 8px;
    height: 8px;
    background: #0ff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    box-shadow: 0 0 15px #0ff;
  }
  .nebula {
    position: absolute;
    width: 300%;
    height: 300%;
    background: 
      radial-gradient(circle at 20% 30%, rgba(120,0,255,0.4) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,255,255,0.3) 0%, transparent 40%);
    animation: nebulaMove 80s infinite alternate ease-in-out;
    filter: blur(80px);
    z-index: 1;
  }
  @keyframes nebulaMove {
    0% { transform: translate(-20%, -20%) rotate(0deg); }
    100% { transform: translate(20%, 20%) rotate(360deg); }
  }
  .buttons-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 10;
    width: 98%;
    max-width: 600px;
    align-items: center;
  }
  .neon-button {
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(20px);
    color: #fff;
    padding: 22px 20px;
    width: 100%;
    border: 3px solid #0ff;
    border-radius: 80px;
    cursor: pointer;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 3px;
    position: relative;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-transform: uppercase;
    text-align: center;
    box-shadow: 0 0 25px rgba(0,255,255,0.4);
    text-decoration: none;
    display: block;
  }
  .neon-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,255,255,0.6), transparent);
    transition: left 0.6s;
  }
  .neon-button:hover::before, .neon-button:active::before {
    left: 100%;
  }
  .neon-button:hover, .neon-button:active {
    background: rgba(0, 255, 255, 0.35);
    box-shadow: 0 0 50px #0ff, 0 0 100px #0ff;
    transform: scale(1.03) translateY(-3px);
    border-color: #fff;
  }
  .social-container {
    display: flex;
    gap: 12px;
    z-index: 10;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
    width: 98%;
    max-width: 600px;
  }
  .mini-button {
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(15px);
    color: #0ff;
    padding: 12px 20px;
    border: 2px solid #0ff;
    border-radius: 50px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    text-transform: uppercase;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1 1 auto;
    min-width: 120px;
  }
  .mini-button:hover, .mini-button:active {
    background: rgba(0, 255, 255, 0.3);
    color: #fff;
    box-shadow: 0 0 20px #0ff;
    transform: scale(1.1);
  }
  .profile-img { 
    width: 120px; 
    height: 120px; 
    border-radius: 50%; 
    border: 4px solid #0ff; 
    z-index: 10;
    box-shadow: 0 0 30px #0ff, 0 0 60px rgba(0,255,255,0.5);
    animation: float 3s ease-in-out infinite;
    object-fit: cover;
    margin-top: 20px;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  h1 {
    margin: 0; 
    font-size: 3.2em;
    color: #0ff; 
    text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
    z-index: 10;
    animation: glow 2s ease-in-out infinite alternate;
    letter-spacing: 5px;
  }
  @keyframes glow {
    from { text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; }
    to { text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 80px #0ff; }
  }
  @media (max-width: 768px) {
    body { padding: 10px; }
    h1 { font-size: 2.8em; }
    .profile-img { width: 100px; height: 100px; }
    .neon-button { 
      font-size: 20px; 
      padding:30px 15px;
      letter-spacing: 2px;
    }
    .buttons-container { width: 100%; max-width: 100%; }
    .social-container { width: 100%; max-width: 100%; }
    .mini-button { font-size: 12px; padding: 10px 16px; min-width: 100px; }
  }
</style>
</head>
<body>

<div class="bg-image"></div>
<div class="scanlines"></div>
<div class="cursor"></div>
<div class="cursor-dot"></div>
<div class="nebula"></div>

<img src="https://p16-common-sign.tiktokcdn.com/tos-alisg-avt-0068/c0438c6f8965c2cd130caa83a8cad2a8~tplv-tiktokx-cropcenter:1080:1080.jpeg?dr=14579&refresh_token=cedddba5&x-expires=1784246400&x-signature=BLfyU%2FeohLXcZFEn%2FMU3cgPBBXM%3D&t=4d5b0474&ps=13740610&shp=a5d48078&shcp=81f88b70&idc=my" alt="Logo" class="profile-img">
<h1>EGO</h1>

<div class="buttons-container">
  <a href="chrome://new-tab-page" class="neon-button">New tab</a>
  <a href="https://github.com/GalacticClient/Galactic-Client" class="neon-button">Galactic client</a>
  <a href="https://modernclient.online/" class="neon-button">Modern client</a>
  <a href="https://free-quiz.varios.store/books?level=2" class="neon-button">Free quiz</a>

</div>

<div class="social-container">
  <a href="https://instagram.com/" class="mini-button">Instagram</a>
  <a href="https://www.tiktok.com/@alexcph8888?is_from_webapp=1&sender_device=pc" class="mini-button">TikTok</a>
  <a href="https://twitter.com/" class="mini-button">Twitter</a>
  <a href="https://facebook.com/" class="mini-button">Facebook</a>
  <a href="https://discord.gg/" class="mini-button">Discord</a>
</div>

<script>
  if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
    const cursor = document.querySelector('.cursor');
    const cursorDot = document.querySelector('.cursor-dot');
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursorDot.style.left = e.clientX - 4 + 'px';
      cursorDot.style.top = e.clientY - 4 + 'px';
    });
    function animateCursor() {
      cursor.style.left = mouseX - 15 + 'px';
      cursor.style.top = mouseY - 15 + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();
    document.querySelectorAll('.neon-button, .mini-button').forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        cursor.style.transform = 'scale(3)';
        cursor.style.background = 'rgba(0,255,255,0.2)';
      });
      btn.addEventListener('mouseleave', () => {
        cursor.style.transform = 'scale(1)';
        cursor.style.background = 'transparent';
      });
    });
  }
</script>

</body>
</html>
